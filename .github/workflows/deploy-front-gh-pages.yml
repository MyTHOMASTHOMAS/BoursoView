name: Deploy Front to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Le cache lit désormais le fichier lock à la racine du monorepo
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # L'installation se fait à la racine pour respecter les workspaces
        run: npm ci

      - name: Build front
        # On cible uniquement le frontend avec l'argument workspace (-w)
        run: npm run build -w bourso_view_front

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Le chemin du build reste le même
          path: bourso_view_front/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4